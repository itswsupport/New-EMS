# =============================================================================
# Production overlay — apply ON TOP of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# NOTE ON PORTS: this file deliberately declares NO `ports:`. Compose MERGES
# port lists by appending, so re-declaring a port here would create a SECOND
# binding (e.g. 0.0.0.0:8080 *and* 127.0.0.1:8080) — they collide, and the
# insecure 0.0.0.0 binding survives. Bind addresses are controlled by
# GATEWAY_BIND_IP / API_BIND_IP in .env instead, which cannot merge wrongly.
#
# What this overlay changes vs. the dev stack:
#   • restart: always — survives reboots and daemon restarts
#   • production log rotation
#   • Postgres publishes NO ports (reachable only on ems-net)
#   • Postgres runs TimescaleDB (hypertable + continuous aggregates) on the
#     pgdata_ts volume — the permanent home after the 2026-09-15 cutover
#     (see docs/timescale-migration.md). `!reset` REPLACES the base pgdata mount
#     rather than appending (needs Docker Compose >= 2.24).
# =============================================================================

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: always
    # Explicitly no `ports:` — never expose the database to the network.
    # !override REPLACES the base pgdata mount (needs Compose >= 2.24). NOTE:
    # !reset does NOT work here — it clears the mount without adding the new one,
    # leaving the DB on ephemeral container storage.
    volumes: !override
      - pgdata_ts:/home/postgres/pgdata/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  app:
    restart: always
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # TimescaleDB data (post-cutover). The old `pgdata` volume from the base
  # compose is intentionally left untouched as a rollback point until retired.
  pgdata_ts:
