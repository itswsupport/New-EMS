# =============================================================================
# Device / Register Map — Rishabh LM1360, addresses confirmed by live scan.
# Config-driven: edit this file + `docker compose restart app` (no rebuild).
#
# ENERGY UNIT NOTE: meter07 accumulates energy in Wh; meter10 & 11 were
# configured (CT-PT / energy-unit setting) to accumulate in kWh — 1000x coarser.
# To store all meters uniformly in Wh, meter10 & 11 apply scale: 1000 to their
# active_energy and reactive_energy registers. (Power/demand are base units on
# all meters, so only the two energy counters are scaled.)
#
# REACTIVE ENERGY NOTE — DO NOT PROBE THIS LIVE. The LM1360 keeps reactive energy
# in TWO counters, capacitive and inductive (manual Rev G, "Modbus registers for
# Main energy Count"). Address 76 accumulates 16-800x slower than kWh x tan(phi)
# implies on all three meters — the signature of the CAPACITIVE counter on an
# inductive plant, so 76 is the wrong counter and kVAh billing cannot be built
# from it.
#
# On 2026-08-14 reactive_energy was moved 76 -> 78 to test whether this block
# mirrors the documented order (Wh imp, Wh exp, VArh cap, VArh ind, VAh). It does
# not. Reading 78 CORRUPTED OTHER REGISTERS IN THE SAME POLL: active_energy at 72
# started returning garbage (meter07 swung 179k..36M Wh inside 24h, against a
# clean max step of 736 Wh before the change) and four days of energy and cost
# data were destroyed. Mechanism unconfirmed — note the map already reads 218/220
# fine, so it is not simply block length; 78 may be unmapped on these units and
# the response handling misaligns. Causation is certain: the A/B is exact. Reverted to 76 on 2026-08-18; steps returned to 250-512 Wh
# immediately, confirming the cause.
#
# Corrupt data window: 2026-08-14 05:37 UTC .. 2026-08-18 04:50 UTC.
#
# The remaining unknowns — the true inductive VArh counter, the VAh counter the
# kVAh bill should read, and the overflow registers (Total = OF x 10^EDRC + M,
# EDRC at 46039, energy resolution at 46005) — must be resolved with
# scripts/scan-registers.ts, which reads the meter WITHOUT writing to the
# database. Never explore an unknown register map by editing this file.
# =============================================================================
version: 1
defaults:
  functionCode: 3
  datatype: float32
  quantity: 2
  byteOrder: ABCD

devices:
  # ---- meter07: energy counters already in Wh (no scale) --------------------
  - id: meter07
    slave: 7
    tenant: rucha-engineers
    plant: plant01
    registers: &lm1360_wh
      # system aggregates
      voltage:         { address: 42 }
      current:         { address: 46 }
      active_power:    { address: 52 }
      apparent_power:  { address: 56 }
      reactive_power:  { address: 58 }
      power_factor:    { address: 62 }
      frequency:       { address: 70 }
      active_energy:   { address: 72 }
      # 76 is the CAPACITIVE counter (wrong, but safe) — see REACTIVE ENERGY NOTE.
      reactive_energy: { address: 76 }
      # per-phase voltage / current
      voltage_l1:      { address: 0 }
      voltage_l2:      { address: 2 }
      voltage_l3:      { address: 4 }
      current_l1:      { address: 6 }
      current_l2:      { address: 8 }
      current_l3:      { address: 10 }
      # per-phase active power / power factor
      active_power_l1: { address: 12 }
      active_power_l2: { address: 14 }
      active_power_l3: { address: 16 }
      power_factor_l1: { address: 30 }
      power_factor_l2: { address: 32 }
      power_factor_l3: { address: 34 }
      # power quality
      voltage_thd:     { address: 218 }
      current_thd:     { address: 220 }
      # billed demand
      maximum_demand:  { address: 102 }

  # ---- meter10 & 11: energy counters in kWh -> scale x1000 to Wh -------------
  - id: meter10
    slave: 10
    tenant: rucha-engineers
    plant: plant01
    registers: &lm1360_kwh
      # system aggregates
      voltage:         { address: 42 }
      current:         { address: 46 }
      active_power:    { address: 52 }
      apparent_power:  { address: 56 }
      reactive_power:  { address: 58 }
      power_factor:    { address: 62 }
      frequency:       { address: 70 }
      active_energy:   { address: 72, scale: 1000 }
      # 76 is the CAPACITIVE counter (wrong, but safe) — see REACTIVE ENERGY NOTE.
      reactive_energy: { address: 76, scale: 1000 }
      # per-phase voltage / current
      voltage_l1:      { address: 0 }
      voltage_l2:      { address: 2 }
      voltage_l3:      { address: 4 }
      current_l1:      { address: 6 }
      current_l2:      { address: 8 }
      current_l3:      { address: 10 }
      # per-phase active power / power factor
      active_power_l1: { address: 12 }
      active_power_l2: { address: 14 }
      active_power_l3: { address: 16 }
      power_factor_l1: { address: 30 }
      power_factor_l2: { address: 32 }
      power_factor_l3: { address: 34 }
      # power quality
      voltage_thd:     { address: 218 }
      current_thd:     { address: 220 }
      # billed demand
      maximum_demand:  { address: 102 }
  - id: meter11
    slave: 11
    tenant: rucha-engineers
    plant: plant01
    registers: *lm1360_kwh
